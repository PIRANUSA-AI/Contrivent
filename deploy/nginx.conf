# Served by nginx inside the container. Mounted over
# /etc/nginx/conf.d/default.conf by the Dockerfile.
#
# Two things matter for this site:
#  1. The frame sequence is ~120 MB of WebP. It must be cached hard, or a
#     repeat visitor re-downloads the whole story.
#  2. index.html must never be cached, or an update sits invisible until every
#     visitor's cache expires.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Text assets need gzip: the JS bundle is 375 KB raw, ~110 KB gzipped.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # WebP/MP4 are already compressed; re-gzipping them wastes CPU for nothing.

    # Content-hashed build output: safe to hold for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Frame sequences have stable names (frame_0001.webp), so a long TTL is
    # only safe as long as `npm run frames` output is treated as append-only.
    # Re-rendering a clip with different content wants a cache bust: bump the
    # folder name in src/content.ts, or serve frames under a versioned path.
    location /frames/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Everything else (index.html, favicon, robots, sitemap): revalidate.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Single-page site: no .html files to hide.
    location ~ /\. { deny all; }
}
